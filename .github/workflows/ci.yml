name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  web:
    name: secret-detector (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secret-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: secret-detector/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --if-present

  ml:
    name: ml-backend (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secret-detector/ml-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: secret-detector/ml-backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py feature_extractor.py model_loader.py

